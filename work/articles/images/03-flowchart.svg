<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueCard3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowRed3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171" />
    </marker>
    <marker id="arrowGreen3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <rect width="880" height="460" rx="16" fill="url(#bgGrad3)" stroke="#334155" stroke-width="2" />

  <text x="440" y="40" fill="#f8fafc" font-size="20" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">砂轮线速度与转速安全与质量闭环监控流程</text>
  <text x="440" y="64" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">机械计算器 • 规避砂轮爆破与磨削烧伤双重风险</text>

  <!-- Start -->
  <rect x="310" y="90" width="260" height="44" rx="22" fill="#334155" stroke="#38bdf8" stroke-width="2" filter="url(#shadow3)" />
  <text x="440" y="117" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">🔍 测量砂轮即时实际外径 D (mm)</text>

  <!-- Left: Safety Check (n -> v) -->
  <path d="M 360 134 L 360 165 L 220 165 L 220 185" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow3)" />
  <!-- Right: Process Setting (v -> n) -->
  <path d="M 520 134 L 520 165 L 660 165 L 660 185" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen3)" />

  <rect x="130" y="152" width="180" height="24" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="220" y="168" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">【场景 A】安全核算: 求线速度</text>

  <rect x="570" y="152" width="180" height="24" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1" />
  <text x="660" y="168" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">【场景 B】工艺调机: 求转速</text>

  <!-- Left Box 1 -->
  <rect x="90" y="190" width="260" height="70" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow3)" />
  <text x="105" y="212" fill="#38bdf8" font-size="11" font-weight="bold" font-family="sans-serif">已知主轴转速 n (r/min)</text>
  <text x="105" y="233" fill="#ffffff" font-size="12" font-family="monospace">v = (π · D · n) / 60000</text>
  <text x="105" y="250" fill="#94a3b8" font-size="11" font-family="sans-serif">计算外缘即时切削线速度 v (m/s)</text>

  <path d="M 220 260 L 220 285" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow3)" />

  <!-- Left Decision -->
  <rect x="90" y="290" width="260" height="42" rx="8" fill="#334155" stroke="#f59e0b" stroke-width="2" filter="url(#shadow3)" />
  <text x="220" y="316" fill="#fef3c7" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">是否超过砂轮铭牌最高限速?</text>

  <path d="M 140 332 L 140 365" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed3)" />
  <path d="M 300 332 L 300 365" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen3)" />

  <rect x="70" y="370" width="140" height="60" rx="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5" />
  <text x="140" y="392" fill="#fecaca" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">🚨 致命超速风险</text>
  <text x="140" y="412" fill="#ffffff" font-size="11" text-anchor="middle" font-family="sans-serif">停机! 降低转速防爆破</text>

  <rect x="230" y="370" width="140" height="60" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
  <text x="300" y="392" fill="#a7f3d0" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">✅ 处于安全转速区</text>
  <text x="300" y="412" fill="#ffffff" font-size="11" text-anchor="middle" font-family="sans-serif">核查是否在最佳工艺区间</text>

  <!-- Right Box 1 -->
  <rect x="530" y="190" width="260" height="70" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5" filter="url(#shadow3)" />
  <text x="545" y="212" fill="#34d399" font-size="11" font-weight="bold" font-family="sans-serif">选定推荐工艺线速度 v (m/s)</text>
  <text x="545" y="233" fill="#ffffff" font-size="12" font-family="monospace">n = (60000 · v) / (π · D)</text>
  <text x="545" y="250" fill="#94a3b8" font-size="11" font-family="sans-serif">陶瓷 30~35 m/s, CBN 80~120 m/s</text>

  <path d="M 660 260 L 660 285" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen3)" />

  <rect x="530" y="290" width="260" height="60" rx="10" fill="url(#blueCard3)" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow3)" />
  <text x="545" y="314" fill="#bfdbfe" font-size="11" font-weight="bold" font-family="sans-serif">数控主轴恒线速补偿执行</text>
  <text x="545" y="334" fill="#ffffff" font-size="12" font-family="sans-serif">输入主轴 S 指令 / 调节变频器频率</text>

  <path d="M 660 350 L 660 375" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen3)" />

  <rect x="530" y="380" width="260" height="50" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2" />
  <text x="660" y="402" fill="#6ee7b7" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">🌟 恒定磨削比 • 消除微观热烧伤</text>
  <text x="660" y="418" fill="#ffffff" font-size="11" text-anchor="middle" font-family="sans-serif">工件表面粗糙度稳定达到设计要求</text>
</svg>
