<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueCard6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow6" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow6" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="880" height="460" rx="16" fill="url(#bgGrad6)" stroke="#334155" stroke-width="2" />

  <text x="440" y="40" fill="#f8fafc" font-size="20" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">蜗杆加工数据核心计算与自锁性工程决策流程</text>
  <text x="440" y="64" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">机械计算器 • 模数、头数、分度圆与导程角联动</text>

  <!-- Step 1: Input -->
  <rect x="50" y="95" width="220" height="75" rx="10" fill="url(#blueCard6)" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow6)" />
  <text x="65" y="120" fill="#bfdbfe" font-size="11" font-weight="bold" font-family="sans-serif">STEP 1 • 确定基础参数</text>
  <text x="65" y="140" fill="#ffffff" font-size="12" font-family="sans-serif">模数 m (mm)</text>
  <text x="65" y="158" fill="#fde047" font-size="12" font-weight="bold" font-family="sans-serif">头数 z (正整数) + 分度圆 d</text>

  <path d="M 270 132 L 320 132" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow6)" />

  <!-- Step 2: Output Calc -->
  <rect x="330" y="95" width="260" height="75" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow6)" />
  <text x="345" y="120" fill="#38bdf8" font-size="11" font-weight="bold" font-family="sans-serif">STEP 2 • 计算器秒级输出核心数据</text>
  <text x="345" y="139" fill="#f1f5f9" font-size="12" font-family="monospace">齿距 p = π · m,  导程 L = p · z</text>
  <text x="345" y="157" fill="#a5f3fc" font-size="12" font-weight="bold" font-family="monospace">导程角 γ = arctan(m · z / d)</text>

  <path d="M 590 132 L 640 132" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow6)" />

  <!-- Step 3: Production -->
  <rect x="650" y="95" width="180" height="75" rx="10" fill="url(#blueCard6)" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow6)" />
  <text x="665" y="120" fill="#bfdbfe" font-size="11" font-weight="bold" font-family="sans-serif">STEP 3 • 机床指令应用</text>
  <text x="665" y="140" fill="#ffffff" font-size="12" font-family="sans-serif">螺纹磨架偏角: 设为 γ</text>
  <text x="665" y="158" fill="#ffffff" font-size="12" font-family="sans-serif">旋风铣/数控导程: F = L</text>

  <!-- Down Branch to Self-Locking Check -->
  <path d="M 460 170 L 460 215" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow6)" />

  <rect x="330" y="220" width="260" height="40" rx="8" fill="#334155" stroke="#f59e0b" stroke-width="2" filter="url(#shadow6)" />
  <text x="460" y="245" fill="#fef3c7" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">根据计算出的导程角 γ 评估机构自锁性</text>

  <!-- Three Outcomes -->
  <path d="M 330 240 L 160 240 L 160 280" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow6)" />
  <path d="M 460 260 L 460 280" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow6)" />
  <path d="M 590 240 L 720 240 L 720 280" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow6)" />

  <!-- Box 1 -->
  <rect x="50" y="285" width="220" height="135" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow6)" />
  <text x="65" y="310" fill="#6ee7b7" font-size="12" font-weight="bold" font-family="sans-serif">γ ≤ 3.5° (单头小导程)</text>
  <text x="65" y="332" fill="#a7f3d0" font-size="12" font-weight="bold" font-family="sans-serif">🔒 强静态自锁区间</text>
  <text x="65" y="354" fill="#ffffff" font-size="11" font-family="sans-serif">• 升降平台、手动千斤顶</text>
  <text x="65" y="374" fill="#ffffff" font-size="11" font-family="sans-serif">• 断电绝不溜钩溜车</text>
  <text x="65" y="394" fill="#94a3b8" font-size="11" font-family="sans-serif">• 传动效率相对较低 η ≈ 30~50%</text>

  <!-- Box 2 -->
  <rect x="350" y="285" width="220" height="135" rx="10" fill="#451a03" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow6)" />
  <text x="365" y="310" fill="#fcd34d" font-size="12" font-weight="bold" font-family="sans-serif">3.5° &lt; γ &lt; 6.0°</text>
  <text x="365" y="332" fill="#fef08a" font-size="12" font-weight="bold" font-family="sans-serif">⚠️ 临界半自锁区间</text>
  <text x="365" y="354" fill="#ffffff" font-size="11" font-family="sans-serif">• 静态自锁，但振动下易失效</text>
  <text x="365" y="374" fill="#ffffff" font-size="11" font-family="sans-serif">• 遇剧烈冲击可能发生溜车</text>
  <text x="365" y="394" fill="#fca5a5" font-size="11" font-weight="bold" font-family="sans-serif">• 必须额外加装安全机械制动器!</text>

  <!-- Box 3 -->
  <rect x="610" y="285" width="220" height="135" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow6)" />
  <text x="625" y="310" fill="#7dd3fc" font-size="12" font-weight="bold" font-family="sans-serif">γ ≥ 15.0° (多头大导程)</text>
  <text x="625" y="332" fill="#38bdf8" font-size="12" font-weight="bold" font-family="sans-serif">⚡ 高效无自锁传动</text>
  <text x="625" y="354" fill="#ffffff" font-size="11" font-family="sans-serif">• 高速精密减速机、伺服驱动</text>
  <text x="625" y="374" fill="#ffffff" font-size="11" font-family="sans-serif">• 传动效率极高 η 可达 80~90%</text>
  <text x="625" y="394" fill="#ffffff" font-size="11" font-family="sans-serif">• 具备可逆向逆驱动能力</text>
</svg>
