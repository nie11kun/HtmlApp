<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueCard4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="880" height="440" rx="16" fill="url(#bgGrad4)" stroke="#334155" stroke-width="2" />

  <text x="440" y="40" fill="#f8fafc" font-size="20" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">车间三针测量与进刀终尺寸控制闭环流程</text>
  <text x="440" y="64" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">机械计算器 • 外螺纹/丝杠千分尺测量实战</text>

  <!-- Step 1 -->
  <rect x="50" y="95" width="230" height="75" rx="10" fill="url(#blueCard4)" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow4)" />
  <text x="65" y="120" fill="#bfdbfe" font-size="11" font-weight="bold" font-family="sans-serif">STEP 1 • 车间现场测量</text>
  <text x="65" y="140" fill="#ffffff" font-size="12" font-family="sans-serif">千分尺测外径 D (mm)</text>
  <text x="65" y="157" fill="#fde047" font-size="12" font-family="sans-serif">跨三根标准量针测 M (mm)</text>

  <path d="M 280 132 L 330 132" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow4)" />

  <!-- Step 2 -->
  <rect x="340" y="95" width="240" height="75" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow4)" />
  <text x="355" y="120" fill="#38bdf8" font-size="11" font-weight="bold" font-family="sans-serif">STEP 2 • 计算器秒算终尺寸 H</text>
  <text x="355" y="142" fill="#ffffff" font-size="14" font-weight="bold" font-family="monospace">H = (D - M)/2 + d0</text>
  <text x="355" y="158" fill="#94a3b8" font-size="11" font-family="sans-serif">消除手工除以2和加减符号算错风险</text>

  <path d="M 580 132 L 630 132" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow4)" />

  <!-- Step 3 -->
  <rect x="640" y="95" width="190" height="75" rx="10" fill="#334155" stroke="#f59e0b" stroke-width="2" filter="url(#shadow4)" />
  <text x="735" y="125" fill="#fef3c7" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">尺寸符合性判定</text>
  <text x="735" y="147" fill="#ffffff" font-size="12" text-anchor="middle" font-family="sans-serif">H 是否进入图纸公差带?</text>

  <!-- Down Branch -->
  <path d="M 735 170 L 735 230 L 440 230 L 440 250" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow4)" />

  <!-- Three Outcomes -->
  <rect x="50" y="270" width="230" height="120" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow4)" />
  <text x="65" y="295" fill="#38bdf8" font-size="12" font-weight="bold" font-family="sans-serif">尺寸尚大 (H 大于目标)</text>
  <text x="65" y="320" fill="#f1f5f9" font-size="11" font-family="sans-serif">牙槽深度尚未切够，还需进刀</text>
  <text x="65" y="345" fill="#a5f3fc" font-size="12" font-family="monospace">吃刀量 ΔX = (H - H_goal) × 2</text>
  <text x="65" y="372" fill="#94a3b8" font-size="11" font-family="sans-serif">机床微调进给再次磨削 ➔</text>

  <rect x="325" y="270" width="230" height="120" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2" filter="url(#shadow4)" />
  <text x="340" y="295" fill="#6ee7b7" font-size="13" font-weight="bold" font-family="sans-serif">✅ 命中公差带 (合格)</text>
  <text x="340" y="325" fill="#ffffff" font-size="12" font-family="sans-serif">H 达到工艺标定终尺寸</text>
  <text x="340" y="355" fill="#a7f3d0" font-size="12" font-weight="bold" font-family="sans-serif">精密外螺纹/丝杠尺寸合格</text>
  <text x="340" y="375" fill="#ffffff" font-size="11" font-family="sans-serif">准予退刀下件进入下道工序</text>

  <rect x="600" y="270" width="230" height="120" rx="10" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow4)" />
  <text x="615" y="295" fill="#fca5a5" font-size="12" font-weight="bold" font-family="sans-serif">🚨 尺寸磨小 (H 小于下限)</text>
  <text x="615" y="320" fill="#ffffff" font-size="11" font-family="sans-serif">牙槽切削过深，零件已超差</text>
  <text x="615" y="350" fill="#fecaca" font-size="12" font-weight="bold" font-family="sans-serif">不可逆切深过量</text>
  <text x="615" y="372" fill="#cbd5e1" font-size="11" font-family="sans-serif">停机复盘操作失误或量针误差</text>
</svg>
