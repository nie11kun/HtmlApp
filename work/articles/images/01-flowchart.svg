<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="orangeCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="500" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Title -->
  <text x="440" y="42" fill="#f8fafc" font-size="20" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">双圆弧滚道参数计算与质检决策闭环流程</text>
  <text x="440" y="66" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">机械计算器 • 滚珠丝杠与导轨滚道几何解析</text>

  <!-- Start Node -->
  <rect x="330" y="90" width="220" height="42" rx="21" fill="#334155" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)" />
  <text x="440" y="116" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle" font-family="sans-serif">🚀 开始工艺规划 / 质检任务</text>

  <!-- Split Lines -->
  <path d="M 380 132 L 380 165 L 220 165 L 220 185" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 500 132 L 500 165 L 660 165 L 660 185" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)" />

  <rect x="130" y="150" width="180" height="24" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="220" y="166" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">【正向】加工与数控编程</text>

  <rect x="570" y="150" width="180" height="24" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1" />
  <text x="660" y="166" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">【逆向】三坐标检测与反推</text>

  <!-- Left Column: Forward Design -->
  <!-- Step 1 -->
  <rect x="90" y="190" width="260" height="52" rx="10" fill="url(#blueCard)" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)" />
  <text x="105" y="212" fill="#bfdbfe" font-size="11" font-weight="bold" font-family="sans-serif">STEP 1 • 确定基础条件</text>
  <text x="105" y="231" fill="#ffffff" font-size="13" font-family="sans-serif">钢球直径 Dw 与 目标接触角 α</text>

  <path d="M 220 242 L 220 262" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 2 -->
  <rect x="90" y="265" width="260" height="82" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)" />
  <text x="105" y="286" fill="#38bdf8" font-size="11" font-weight="bold" font-family="sans-serif">STEP 2 • 正向公式极速秒算</text>
  <text x="105" y="306" fill="#f1f5f9" font-size="12" font-family="monospace">R = k · Dw / 2 (系数 k=1.11)</text>
  <text x="105" y="324" fill="#f1f5f9" font-size="12" font-family="monospace">水平偏心 x = (R - Dw/2)·sin(α)</text>
  <text x="105" y="340" fill="#94a3b8" font-size="11" font-family="monospace">垂直偏心 y = (R - Dw/2)·cos(α)</text>

  <path d="M 220 347 L 220 368" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 3 -->
  <rect x="90" y="372" width="260" height="52" rx="10" fill="url(#blueCard)" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)" />
  <text x="105" y="394" fill="#bfdbfe" font-size="11" font-weight="bold" font-family="sans-serif">STEP 3 • 现场机床实操</text>
  <text x="105" y="413" fill="#ffffff" font-size="13" font-family="sans-serif">写入成型砂轮修整程序 / 上机磨削</text>

  <!-- Right Column: Reverse Inspection -->
  <!-- Step 1 Rev -->
  <rect x="530" y="190" width="260" height="52" rx="10" fill="url(#greenCard)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)" />
  <text x="545" y="212" fill="#a7f3d0" font-size="11" font-weight="bold" font-family="sans-serif">STEP 1 • 三坐标测量取样</text>
  <text x="545" y="231" fill="#ffffff" font-size="13" font-family="sans-serif">测得实测半径 R 与 水平偏心 x</text>

  <path d="M 660 242 L 660 262" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)" />

  <!-- Step 2 Rev -->
  <rect x="530" y="265" width="260" height="82" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)" />
  <text x="545" y="286" fill="#34d399" font-size="11" font-weight="bold" font-family="sans-serif">STEP 2 • 反向推算真实物理角</text>
  <text x="545" y="306" fill="#f1f5f9" font-size="12" font-family="monospace">理论钢球 Dw = 2 · R / k</text>
  <text x="545" y="324" fill="#f1f5f9" font-size="12" font-family="monospace">实际接触角 α = arcsin(x / Δ)</text>
  <text x="545" y="340" fill="#94a3b8" font-size="11" font-family="monospace">其中偏心总距 Δ = R - Dw/2</text>

  <path d="M 660 347 L 660 368" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)" />

  <!-- Step 3 Rev Decision -->
  <rect x="530" y="372" width="260" height="52" rx="10" fill="url(#greenCard)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)" />
  <text x="545" y="394" fill="#a7f3d0" font-size="11" font-weight="bold" font-family="sans-serif">STEP 3 • 接触角偏差评定</text>
  <text x="545" y="413" fill="#ffffff" font-size="13" font-family="sans-serif">合格放行装配 / 超差报警反修砂轮</text>

  <!-- Bottom Connecting Loop -->
  <path d="M 350 398 L 522 398" fill="none" stroke="#64748b" stroke-dasharray="4,4" stroke-width="1.5" />
  <text x="440" y="393" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">工件送检 ➜ 闭环校核</text>
</svg>
